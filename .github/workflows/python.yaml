name: Python CI (Forgejo Integration)

on:
  workflow_dispatch:
    inputs:
     forgejo_commit_sha:
        description: 'Commit SHA to build and test'
        required: true
  repository_dispatch:
    types: [forgejo_ci_trigger]

permissions:
  contents: read

env:
  FORGEJO_COMMIT_SHA: ${{ github.event.inputs.forgejo_commit_sha }}
  CODEBERG_REPO_URL: "https://codeberg.org/${{ github.repository }}"

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: anttikivi/forgejo-status@v0.1.2
        with:
          token: ${{ secrets.CODEBERG_TOKEN }}
          context: "Python CI - Linux ${{ matrix.target}}"
          sha: ${{ github.event.inputs.forgejo_commit_sha }}
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.forgejo_commit_sha }}
          github-server-url: https://codeberg.org
          token: ${{ secrets.CODEBERG_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: 3.8
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          before-script-linux: |
            # Some container images are based on Ubuntu, other on CentOS
            which unzip || apt install unzip || echo "not apt"
            which unzip || yum install unzip || echo "not yum"
            which unzip
            PROTOC=protoc-32.0-linux-x86_64.zip
            if [ "$(arch)" == "i686" ]; then PROTOC=protoc-32.0-linux-x86_32.zip; fi
            curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v32.0/$PROTOC
            unzip $PROTOC -d protoc3
            mv -v protoc3/bin/* /usr/local/bin/
            mv -v protoc3/include/* /usr/local/include/
            rm -rf $PROTOC protoc3
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: python/dist
      - uses: astral-sh/setup-uv@v7
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          cd python
          set -e
          uv venv .venv
          source .venv/bin/activate
          uv pip install zetasketch-py --no-index --no-deps --find-links dist --reinstall
          uv pip install zetasketch-py pytest
          pytest -k "not mypy and not ruff"
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-venv
          run: |
            set -e
            cd python
            python3 -m venv .venv
            source .venv/bin/activate
            pip install pytest
            pip install zetasketch-py --no-index --no-deps --find-links dist --force-reinstall
            pip install zetasketch-py
            pytest -k "not mypy and not ruff"

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: anttikivi/forgejo-status@v0.1.2
        with:
          token: ${{ secrets.CODEBERG_TOKEN }}
          context: "Python CI - musllinux ${{ matrix.target}}"
          sha: ${{ github.event.inputs.forgejo_commit_sha }}
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.forgejo_commit_sha }}
          github-server-url: https://codeberg.org
          token: ${{ secrets.CODEBERG_TOKEN }}
      - name: Install protoc
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
          working-directory: python
          before-script-linux: |
            apt install unzip
            PROTOC=protoc-32.0-linux-x86_64.zip
            if [ "$(arch)" == "i686" ]; then PROTOC=protoc-32.0-linux-x86_32.zip; fi
            curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v32.0/$PROTOC
            unzip $PROTOC -d protoc3
            mv -v protoc3/bin/* /usr/local/bin/
            mv -v protoc3/include/* /usr/local/include/
            rm -rf $PROTOC protoc3
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: python/dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        run: |
          set -e
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c '
            cd python
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install zetasketch-py --no-index --no-deps --find-links dist --force-reinstall
            pip install zetasketch-py pytest
            pytest -k "not mypy and not ruff"
          '
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          install: |
            apk add py3-virtualenv
          run: |
            cd python
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install zetasketch-py --no-index --no-deps --find-links dist --force-reinstall
            pip install zetasketch-py pytest
            pytest -k "not mypy and not ruff"

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: anttikivi/forgejo-status@v0.1.2
        with:
          token: ${{ secrets.CODEBERG_TOKEN }}
          context: "Python CI - Windows ${{ matrix.target}}"
          sha: ${{ github.event.inputs.forgejo_commit_sha }}
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.forgejo_commit_sha }}
          github-server-url: https://codeberg.org
          token: ${{ secrets.CODEBERG_TOKEN }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          working-directory: python
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: python/dist
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'aarch64') }}
        shell: bash
        run: |
          cd python
          set -e
          python3 -m venv .venv
          source .venv/Scripts/activate
          pip install --upgrade pip
          pip install zetasketch-py --find-links dist --force-reinstall
          pip install --group test
          pytest -k "not mypy and not ruff"

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-13
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: anttikivi/forgejo-status@v0.1.2
        with:
          token: ${{ secrets.CODEBERG_TOKEN }}
          context: "Python CI - macOS ${{ matrix.target}}"
          sha: ${{ github.event.inputs.forgejo_commit_sha }}
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.forgejo_commit_sha }}
          github-server-url: https://codeberg.org
          token: ${{ secrets.CODEBERG_TOKEN }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          working-directory: python
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: python/dist
      - name: pytest
        run: |
          cd python
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install zetasketch-py --find-links dist --force-reinstall
          pip install --group test
          pytest -k "not mypy and not ruff"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: anttikivi/forgejo-status@v0.1.2
        with:
          token: ${{ secrets.CODEBERG_TOKEN }}
          context: "Python CI - sdist"
          sha: ${{ github.event.inputs.forgejo_commit_sha }}
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.forgejo_commit_sha }}
          github-server-url: https://codeberg.org
          token: ${{ secrets.CODEBERG_TOKEN }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
          before-script-linux: |
            sudo apt install unzip
            PROTOC=protoc-32.0-linux-x86_64.zip
            if [ "$(arch)" == "i686" ]; then PROTOC=protoc-32.0-linux-x86_32.zip; fi
            curl -OL https://github.com/protocolbuffers/protobuf/releases/download/v32.0/$PROTOC
            unzip $PROTOC -d protoc3
            sudo mv -v protoc3/bin/* /usr/local/bin/
            sudo mv -v protoc3/include/* /usr/local/include/
            rm -rf $PROTOC protoc3
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/dist

