name: Rust CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & Test
    runs-on: docker
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - uses: https://github.com/actions-rs/toolchain@v1
        name: Install toolchain
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --tests --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        uses: https://github.com/taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Build
        run: cargo build --verbose --all-features --locked

      - name: Run tests
        run: cargo test --verbose --all-features --locked

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items --all-features --locked

  release:
    name: Publish to crates.io
    runs-on: docker
    needs: [build-test]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: https://github.com/actions-rs/toolchain@v1

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --dry-run

      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.11.1
        with:
          direction: "upload"
          release-notes-assistant: true
          skip-assets: true
